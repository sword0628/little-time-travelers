<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff9ef"><title>Little Time Travelers</title>
<style>
:root{--ink:#29394b;--muted:#6c7783;--paper:#fffaf0;--coral:#c74732;--blue:#315eae;--green:#367b64;--line:#e7e2d6}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'Trebuchet MS',Arial,sans-serif}button,input{font:inherit}button{cursor:pointer;border:0;min-height:48px}button:focus-visible,input:focus-visible,[role=slider]:focus-visible{outline:3px solid var(--blue);outline-offset:4px}
header{max-width:960px;margin:0 auto;padding:28px 28px 16px;display:flex;align-items:center;gap:10px}.logo{background:#f8d784;border:2px solid var(--ink);border-radius:12px;width:36px;height:36px;display:grid;place-items:center;font-size:25px}.brand{font-size:24px;font-weight:800;letter-spacing:-.7px}main{max-width:960px;margin:0 auto;padding:12px 28px 32px}.layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:28px;align-items:center}
.clock-card{background:white;border:1px solid var(--line);border-radius:30px;padding:20px 16px}.legend{display:flex;justify-content:center;gap:28px;font-size:15px;font-weight:700}.legend span:first-child{color:var(--coral)}.legend span:last-child{color:var(--blue)}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;background:var(--coral)}.dot.blue{background:var(--blue)}svg{width:100%;display:block;overflow:visible;touch-action:none;user-select:none}.hand{cursor:grab;touch-action:none}.hand:active{cursor:grabbing}#minuteHand .visible,#minuteHand circle{pointer-events:none}.hand .hit{stroke:transparent;stroke-width:30}.hand:focus-visible .visible{filter:drop-shadow(0 0 4px #f3c664)}
.digital{display:flex;justify-content:center;align-items:center;gap:8px;margin:0 auto;width:max-content;padding:5px 14px;border-radius:18px;background:#f4f6fa}.digital input{width:82px;font-size:50px;font-weight:700;text-align:center;border:0;background:transparent;padding:4px 0;appearance:textfield;font-variant-numeric:tabular-nums}.digital #hours{color:var(--coral)}.digital #minutes{color:var(--blue)}.digital span{font-size:40px;color:var(--muted)}.caption{text-align:center;font-size:13px;color:var(--muted);margin:12px 0 0}.error:empty{display:none}.error{text-align:center;font-size:13px;color:#ad2b27;margin-top:8px}
.side{min-width:0}.tabs{display:flex;padding:5px;background:#ebe9df;border-radius:16px;gap:4px;margin-bottom:20px}.tabs button{width:50%;border-radius:12px;background:transparent;padding:10px;color:var(--muted);font-size:17px;font-weight:800}.tabs button.active{background:white;color:var(--ink)}.activity{background:#edf4ee;border:1px solid #dae7dd;border-radius:24px;padding:22px}.custom{display:flex;justify-content:center;align-items:center;gap:12px;margin:3px 0 22px;color:var(--ink);font-size:20px;font-weight:700}.custom input{width:104px;padding:12px 6px;border:1px solid #bfd4c3;border-radius:14px;background:white;text-align:center;font-size:32px;font-weight:800;color:var(--ink)}.travel-buttons{display:flex;gap:10px}.travel-buttons button,.primary{padding:14px 12px;border-radius:14px;font-size:18px;font-weight:800;flex:1;min-height:56px}.earlier{background:white;color:var(--green);border:1px solid #c4d8ca}.later,.primary{background:var(--green);color:white}.journey:empty{display:none}.journey{margin:22px 2px 0}.journey h3{font-size:17px;margin:0 0 16px}.hop{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:12px 0}.hop .pill{background:#f7e5bb;border-radius:10px;padding:9px;font-weight:800;font-size:14px;min-width:75px;text-align:center}.hop strong{font-size:19px;font-variant-numeric:tabular-nums;white-space:nowrap}.explain{background:#fff0c8;padding:16px;border-radius:14px;font-size:17px;line-height:1.6;margin-top:16px;white-space:pre-line}.question{font-size:25px;font-weight:800;line-height:1.5;text-align:center;margin:0 0 22px}.actions{display:flex;gap:10px}.secondary{border:1px solid #bfd4c3;color:var(--green);border-radius:12px;background:white;padding:12px 15px;font-size:16px;font-weight:bold}.feedback:empty{display:none}.feedback{font-size:17px;font-weight:700;line-height:1.5;margin-top:18px}.quiet-actions{justify-content:space-between;margin-top:20px}.quiet-actions button{background:transparent;border:0;font-size:14px;color:var(--muted);padding:5px}.hidden{display:none!important}
@media(max-width:720px){header{padding:20px 20px 10px}.brand{font-size:22px}main{padding:8px 16px 28px}.layout{grid-template-columns:1fr;gap:20px;max-width:480px;margin:auto}.clock-card{padding:16px 12px}.activity{padding:20px}.tabs{margin-bottom:14px}.digital input{font-size:44px;width:74px}.caption{font-size:12px}.journey{margin-top:18px}.hop{justify-content:center;gap:18px}}
@media(prefers-reduced-motion:no-preference){button{transition:background .15s,transform .15s}button:active{transform:scale(.97)}}
</style></head>
<body><header><div class="logo" aria-hidden="true">◷</div><div class="brand">Time to play</div></header>
<main><div class="layout"><section class="clock-card" aria-label="Interactive teaching clock"><div class="legend"><span><i class="dot"></i>Hours</span><span><i class="dot blue"></i>Minutes</span></div>
<svg id="clock" viewBox="0 0 440 440" aria-label="Analog clock"><circle cx="220" cy="220" r="196" fill="#f7f5ed"/><circle cx="220" cy="220" r="178" fill="white" stroke="#e8e5dc" stroke-width="2"/><g id="ticks"></g><g id="numbers"></g><g id="hourHand" class="hand" role="slider" tabindex="0" aria-label="Hour hand" aria-valuemin="1" aria-valuemax="12"><line class="hit" x1="220" y1="226" x2="220" y2="119"/><line class="visible" x1="220" y1="230" x2="220" y2="122" stroke="#c74732" stroke-width="15" stroke-linecap="round"/><circle cx="220" cy="128" r="6" fill="#fff0e6"/></g><g id="minuteHand" class="hand" role="slider" tabindex="0" aria-label="Minute hand" aria-valuemin="0" aria-valuemax="59"><line class="hit" x1="220" y1="110" x2="220" y2="73"/><line class="visible" x1="220" y1="236" x2="220" y2="77" stroke="#315eae" stroke-width="10" stroke-linecap="round"/><circle cx="220" cy="83" r="4" fill="#e4edff"/></g><circle cx="220" cy="220" r="13" fill="#29394b" pointer-events="none"/><circle cx="220" cy="220" r="5" fill="white" pointer-events="none"/></svg>
<div class="digital" aria-label="Editable digital clock"><input id="hours" type="text" inputmode="numeric" maxlength="2" aria-label="Hours, 1 through 12" autocomplete="off"><span>:</span><input id="minutes" type="text" inputmode="numeric" maxlength="2" aria-label="Minutes, 0 through 59" autocomplete="off"></div><div class="error" id="inputError" aria-live="polite"></div><p class="caption">Move the hands or type a time.</p></section>
<div class="side"><div class="tabs" role="tablist" aria-label="Activity"><button id="learnTab" class="active" role="tab" aria-selected="true" aria-controls="learn">Play</button><button id="practiceTab" role="tab" aria-selected="false" aria-controls="practice">Practice</button></div>
<section id="learn" role="tabpanel" aria-labelledby="learnTab"><div class="activity"><div class="custom"><input id="amount" type="number" required min="1" max="180" value="40" aria-label="How many minutes"><label for="amount">minutes</label></div><div class="travel-buttons"><button id="earlier" class="earlier">← Earlier</button><button id="later" class="later">Later →</button></div></div><div class="journey" id="journey" aria-live="polite"></div></section>
<section id="practice" class="hidden" role="tabpanel" aria-labelledby="practiceTab"><div class="activity"><div id="question" class="question"></div><div class="actions"><button id="check" class="primary">Check ✓</button><button id="hint" class="secondary">Hint</button></div><div id="feedback" class="feedback" aria-live="polite"></div><div class="actions quiet-actions"><button id="reset" class="secondary">↺ Reset</button><button id="next" class="secondary">Next →</button></div></div><div id="hintText" class="explain hidden"></div></section>
</div></div></main>
<script>
const $=id=>document.getElementById(id), wrap=n=>((n%720)+720)%720;
let time=160, duration=40, mode='learn', challenge=null, drag=null;
const fmt=t=>{t=wrap(t);return `${Math.floor(t/60)||12}:${String(t%60).padStart(2,'0')}`};
const point=(a,r)=>[220+Math.sin(a*Math.PI/180)*r,220-Math.cos(a*Math.PI/180)*r];
const ns='http://www.w3.org/2000/svg';
function svgEl(tag,attrs,parent,text){const el=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))el.setAttribute(k,v);if(text!=null)el.textContent=text;parent.appendChild(el);return el}
for(let i=0;i<60;i++){const a=point(i*6,i%5===0?161:166),b=point(i*6,172);svgEl('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:i%5===0?'#6d7885':'#d7d9d9','stroke-width':i%5===0?3:1.5,'stroke-linecap':'round'},$('ticks'))}
for(let i=1;i<=12;i++){let p=point(i*30,139);svgEl('text',{x:p[0],y:p[1]+1,'text-anchor':'middle','dominant-baseline':'middle',fill:'#29394b','font-size':27,'font-weight':700},$('numbers'),i);p=point(i*30,189);svgEl('text',{x:p[0],y:p[1]+1,'text-anchor':'middle','dominant-baseline':'middle',fill:'#5774a1','font-size':11,'font-weight':700},$('numbers'),i===12?'00':String(i*5).padStart(2,'0'))}
function render(){const h=Math.floor(time/60)||12,m=time%60;$('hourHand').setAttribute('transform',`rotate(${time/2} 220 220)`);$('minuteHand').setAttribute('transform',`rotate(${m*6} 220 220)`);if(document.activeElement!==$('hours'))$('hours').value=h;if(document.activeElement!==$('minutes'))$('minutes').value=String(m).padStart(2,'0');$('hourHand').setAttribute('aria-valuenow',h);$('hourHand').setAttribute('aria-valuetext',`${h} hours, ${m} minutes`);$('minuteHand').setAttribute('aria-valuenow',m);$('clock').setAttribute('aria-label',`Analog clock showing ${fmt(time)}`)}
function setTime(t){time=wrap(Math.round(t));render();$('journey').replaceChildren();if(mode==='practice')$('feedback').textContent=''}
for(const [id,max,min] of [['hours',12,1],['minutes',59,0]]){const input=$(id);input.addEventListener('focus',()=>input.select());input.addEventListener('input',()=>{const v=Number(input.value);if(!/^\d{1,2}$/.test(input.value)||v<min||v>max){input.setAttribute('aria-invalid','true');$('inputError').textContent=id==='hours'?'Choose an hour from 1 to 12.':'Choose minutes from 00 to 59.';return}input.removeAttribute('aria-invalid');$('inputError').textContent='';setTime(id==='hours'?(v%12)*60+time%60:Math.floor(time/60)*60+v)});input.addEventListener('blur',()=>{input.removeAttribute('aria-invalid');$('inputError').textContent='';input.value=id==='hours'?(Math.floor(time/60)||12):String(time%60).padStart(2,'0')});input.addEventListener('keydown',e=>{if(e.key==='Enter')input.blur();if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();setTime(time+(e.key==='ArrowUp'?1:-1)*(id==='hours'?60:1));input.value=id==='hours'?(Math.floor(time/60)||12):String(time%60).padStart(2,'0')}})}
function angle(e){const r=$('clock').getBoundingClientRect();return Math.atan2(e.clientX-r.left-r.width/2,-(e.clientY-r.top-r.height/2))*180/Math.PI}
for(const [id,step] of [['minuteHand',1],['hourHand',60]]){const el=$(id);el.addEventListener('pointerdown',e=>{if(e.button!==0)return;e.preventDefault();document.activeElement?.blur();drag={id,step,prev:angle(e),total:0,start:time};el.setPointerCapture(e.pointerId)});el.addEventListener('pointermove',e=>{if(!drag||drag.id!==id)return;const a=angle(e);let delta=a-drag.prev;if(delta>180)delta-=360;if(delta< -180)delta+=360;drag.total+=delta;drag.prev=a;setTime(drag.start+Math.round(drag.total/(step===1?6:30))*step)});const end=()=>{drag=null};el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);el.addEventListener('lostpointercapture',end);el.addEventListener('keydown',e=>{if(['ArrowRight','ArrowUp','ArrowLeft','ArrowDown'].includes(e.key)){e.preventDefault();setTime(time+(['ArrowRight','ArrowUp'].includes(e.key)?step:-step))}})}
$('amount').oninput=()=>{const n=Number($('amount').value);if(Number.isInteger(n)&&n>=1&&n<=180)duration=n};
function hops(start,amount,sign){let remaining=amount,t=start,list=[];while(remaining>0){let boundary=sign===1?60-wrap(t)%60:wrap(t)%60||60;let n=Math.min(boundary,remaining);const next=t+sign*n;list.push({from:t,to:next,n});t=next;remaining-=n}return list}
function showJourney(start,amount,sign){const list=hops(start,amount,sign),el=$('journey');el.replaceChildren();const heading=document.createElement('h3');heading.textContent=`${amount} minutes ${sign===1?'later':'earlier'}`;el.append(heading);list.forEach(h=>{const row=document.createElement('div');row.className='hop';const pill=document.createElement('span');pill.className='pill';pill.textContent=`${sign===1?'+':'−'}${h.n} min`;const val=document.createElement('strong');val.textContent=`${fmt(h.from)} → ${fmt(h.to)}`;row.append(pill,val);el.append(row)})}
function travel(sign){if(!$('amount').checkValidity()){$('amount').reportValidity();return}const start=time;setTime(start+sign*duration);showJourney(start,duration,sign)}$('earlier').onclick=()=>travel(-1);$('later').onclick=()=>travel(1);
function newChallenge(first=false){const amounts=[15,20,30,40,45,50],sign=first?1:(Math.random()<.5?-1:1),amount=first?40:amounts[Math.floor(Math.random()*amounts.length)],m=first?40:(sign===1?60-amount+5*Math.floor(Math.random()*(amount/5-1)):5+5*Math.floor(Math.random()*(amount/5-1))),start=first?160:Math.floor(Math.random()*12)*60+m;challenge={start,amount,sign,answer:wrap(start+sign*amount)};$('question').textContent=`${amount} minutes ${sign===1?'later':'earlier'} than ${fmt(start)}?`;$('hintText').classList.add('hidden');setTime(start)}
function switchMode(next){mode=next;for(const name of ['learn','practice']){const active=name===next;$(name).classList.toggle('hidden',!active);$(name+'Tab').classList.toggle('active',active);$(name+'Tab').setAttribute('aria-selected',String(active))}if(next==='practice'&&!challenge)newChallenge(true)}$('learnTab').onclick=()=>switchMode('learn');$('practiceTab').onclick=()=>switchMode('practice');
$('check').onclick=()=>{$('feedback').textContent=time===challenge.answer?`★ You got it! ${fmt(time)}`:'Try again. You can use a hint!'};$('hint').onclick=()=>{const {start,amount,sign}=challenge,first=hops(start,amount,sign)[0];$('hintText').textContent=`First: ${fmt(start)} → ${fmt(first.to)} (${sign===1?'+':'−'}${first.n} min)\nThen ${amount-first.n} more minutes ${sign===1?'forward':'back'}.`;$('hintText').classList.remove('hidden')};$('next').onclick=()=>newChallenge();$('reset').onclick=()=>setTime(challenge.start);
render();
</script></body></html>
